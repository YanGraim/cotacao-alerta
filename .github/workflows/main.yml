name: Monitorar AstroPay

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Consultar AstroPay
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          resposta=$(curl -s -X POST \
            "https://partners-api.astropay.com/v1/public/exchanges" \
            -H "Content-Type: application/json" \
            -d '{"from":"BRL","to":"ARS"}')

          cotacao=$(echo "$resposta" | jq -r '.exchange')

          echo "Cotacao atual: $cotacao ARS/BRL"

          mkdir -p data

          if [ -f data/ultima-cotacao.txt ]; then
            anterior=$(cat data/ultima-cotacao.txt)

            variacao=$(awk -v atual="$cotacao" -v anterior="$anterior" \
              'BEGIN { printf "%.2f", ((atual - anterior) / anterior) * 100 }')

            echo "Cotacao anterior: $anterior ARS/BRL"
            echo "Variacao: $variacao%"

            if awk -v variacao="$variacao" 'BEGIN { exit !(variacao >= 2) }'; then

              echo "Cotacao subiu 2% ou mais!"

              mensagem="🚨 AstroPay

A cotacao SUBIU 2% ou mais!

R$ 1,00 = $cotacao ARS

Variacao: +${variacao}%
Anterior: ${anterior}
Atual: ${cotacao}"

              curl -s -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                -d "$(jq -n \
                  --arg chat_id "$TELEGRAM_CHAT_ID" \
                  --arg text "$mensagem" \
                  '{chat_id: $chat_id, text: $text}')"

            elif awk -v variacao="$variacao" 'BEGIN { exit !(variacao <= -2) }'; then

              echo "Cotacao caiu 2% ou mais!"

              mensagem="🚨 AstroPay

A cotacao CAIU 2% ou mais!

R$ 1,00 = $cotacao ARS

Variacao: ${variacao}%
Anterior: ${anterior}
Atual: ${cotacao}"

              curl -s -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                -d "$(jq -n \
                  --arg chat_id "$TELEGRAM_CHAT_ID" \
                  --arg text "$mensagem" \
                  '{chat_id: $chat_id, text: $text}')"

            else
              echo "A cotacao nao variou 2%."
            fi

          else
            echo "Primeira execucao. Ainda nao existe cotacao anterior."
          fi

          echo "$cotacao" > data/ultima-cotacao.txt

      - name: Salvar cotacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ultima-cotacao.txt

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para salvar."
          else
            git commit -m "Atualizar cotacao AstroPay"
            git push
          fi
